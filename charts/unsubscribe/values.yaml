## Global Docker image parameters
##
# global:
#   imageRegistry: myRegistryName
#   imagePullSecrets:
#     - myRegistryKeySecretName
#   storageClass: myStorageClass

## Add labels to all the deployed resources
##
commonLabels:
  app.kubernetes.io/component: mosip

## Add annotations to all the deployed resources
##
commonAnnotations: {}

## Kubernetes Cluster Domain
##
clusterDomain: cluster.local

## Extra objects to deploy (value evaluated as a template)
##
extraDeploy: []

## Number of nodes
##
replicaCount: 1

service:
  type: ClusterIP
  port: 80
  nodePorts:
    http: ""
    https: ""
  externalTrafficPolicy: Cluster

image:
  registry: docker.io
  repository: nginx
  tag: latest
  pullPolicy: Always

## Port on which this particular service module is running.
containerPort: 80

## Configure extra options for liveness and readiness probes
##
startupProbe:
  enabled: true
  httpGet:
    path: "/"
    port: 80
  initialDelaySeconds: 0
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 10
  successThreshold: 1

livenessProbe:
  enabled: true
  httpGet:
    path: "/"
    port: 80
  initialDelaySeconds: 20
  periodSeconds: 60
  timeoutSeconds: 5
  failureThreshold: 2
  successThreshold: 1

readinessProbe:
  enabled: true
  httpGet:
    path: "/"
    port: 80
  initialDelaySeconds: 0
  periodSeconds: 60
  timeoutSeconds: 5
  failureThreshold: 2
  successThreshold: 1

command: []
args: []

hostAliases: []

resources:
  limits:
    cpu: 100m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 512Mi

additionalResources:
  javaOpts: ""

containerSecurityContext:
  enabled: false
  runAsUser: mosip
  runAsNonRoot: true

podSecurityContext:
  enabled: false
  fsGroup: 1001

podAffinityPreset: ""
podAntiAffinityPreset: soft

nodeAffinityPreset:
  type: ""
  key: ""
  values: []

affinity: {}
nodeSelector: {}
tolerations: []
podLabels: {}
podAnnotations: {}
lifecycleHooks: {}
customLivenessProbe: {}
customReadinessProbe: {}

updateStrategy:
  type: RollingUpdate

extraEnvVars: []

extraEnvVarsCM:
  - global

extraEnvVarsSecret: []
extraVolumes: []
extraVolumeMounts: []
initContainers: {}
sidecars: {}

persistence:
  enabled: false
  storageClass:
  accessModes:
    - ReadWriteOnce
  size: 10M
  existingClaim:
  mountDir:

volumePermissions:
  enabled: false
  image:
    registry: docker.io
    repository: bitnami/bitnami-shell
    tag: "10"
    pullPolicy: Always
    pullSecrets: []
  resources:
    limits: {}
    requests: {}

rbac:
  create: true

serviceAccount:
  create: true
  name:

## Prometheus Metrics
##
metrics:
  enabled: false
  podAnnotations:
    prometheus.io/scrape: "true"

  endpointPath: /actuator/prometheus

  serviceMonitor:
    enabled: true
    interval: 10s
    honorLabels: false
    additionalLabels: {}

  prometheusRule:
    enabled: false
    additionalLabels: {}
    namespace: ''
    rules: []

## Collab environment URLs used in the unsubscribe page
##
collab:
  homepageUrl: https://collab.mosip.net
  getUinUrl: https://self-register.collab.mosip.net/
  apiEndpoint: https://api.collab.mosip.net/unsubscribe

## Istio ingress configuration
##
istio:
  enabled: true
  ingressController:
    name: ingressgateway-internal
  host: unsubscribe.collab.mosip.net
  prefix: /

# Specify the path to the primary index file.
indexFile: "unsubscribe-index.html"

# Specify the custom index file to include if the primary index file is not set.
customindexFile: ""